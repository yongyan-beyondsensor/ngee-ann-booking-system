<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeyondSensor - Executive Summary Tender Presentation Deck (FMS)</title>
  <link rel="stylesheet" href="deck-styles.css">
  <!-- Load modular slides registry directly: works seamlessly via file:// and http:// -->
  <script src="slides/deck-registry.js"></script>
</head>
<body>

  <!-- Slide Container -->
  <div id="deck-container">
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: #FFF; font-family: sans-serif;">
      Loading presentation slides...
    </div>
  </div>

  <!-- Deck Navigation & Presentation Engine Controls -->
  <div class="deck-controls">
    <button class="deck-btn" id="prevBtn" onclick="changeSlide(-1)">◀ Prev</button>
    <div class="deck-status" id="slideStatus">Slide 1 of 11</div>
    <button class="deck-btn" id="nextBtn" onclick="changeSlide(1)">Next ▶</button>
    <button class="deck-btn" onclick="toggleFullscreen()" style="border-left: 1px solid rgba(255,255,255,0.2); margin-left: 6px;">⛶ Fullscreen</button>
    <button class="deck-btn" onclick="window.print()">🖨️ Print / PDF</button>
  </div>

  <script>
    let currentSlide = 1;

    function getInitialSlide(totalSlides) {
      // 1. Try URL hash (e.g. #3 or #slide-3)
      const hash = window.location.hash;
      const match = hash.match(/\d+/);
      if (match) {
        const slideNum = parseInt(match[0], 10);
        if (slideNum >= 1 && slideNum <= totalSlides) return slideNum;
      }
      // 2. Try localStorage
      try {
        const saved = localStorage.getItem('fms_deck_current_slide');
        if (saved) {
          const slideNum = parseInt(saved, 10);
          if (slideNum >= 1 && slideNum <= totalSlides) return slideNum;
        }
      } catch (e) {
        // localStorage might be unavailable or restricted in some file:// origins
      }
      return 1;
    }

    function renderDeck() {
      const container = document.getElementById('deck-container');
      
      if (window.DECK_SLIDES && window.DECK_SLIDES.length > 0) {
        container.innerHTML = window.DECK_SLIDES.map((html, idx) => {
          let adjustedHtml = html;
          // Clear any hardcoded active class from slide templates; active state is driven by showSlide
          adjustedHtml = adjustedHtml.replace(/class=["']slide-viewport active["']/, 'class="slide-viewport"');
          // Normalize image paths if they start with ../assets/ to assets/ so it works from root
          adjustedHtml = adjustedHtml.replace(/src=["']\.\.\/assets\//g, 'src="assets/');
          return adjustedHtml;
        }).join('\n');

        const initialSlide = getInitialSlide(window.DECK_SLIDES.length);
        showSlide(initialSlide, false);
      } else {
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #FFF; font-family: sans-serif; text-align: center;">
            <h3 style="color: #FF54B0;">Unable to load slide templates</h3>
            <p style="color: #94A3B8;">Please check slides/deck-registry.js</p>
          </div>
        `;
      }
    }

    function showSlide(n, updateHistory = true) {
      const slides = document.querySelectorAll('.slide-viewport');
      if (!slides.length) return;
      slides.forEach(el => el.classList.remove('active'));
      
      const target = slides[n - 1];
      if (target) {
        target.classList.add('active');
        currentSlide = n;
        document.getElementById('slideStatus').innerText = `Slide ${currentSlide} of ${slides.length}`;
        
        // Persist slide index across refreshes
        try {
          localStorage.setItem('fms_deck_current_slide', String(n));
        } catch (e) {}

        // Sync URL hash without polluting browser history when not desired
        if (window.location.hash !== `#${n}`) {
          if (updateHistory) {
            history.pushState(null, '', `#${n}`);
          } else {
            history.replaceState(null, '', `#${n}`);
          }
        }
      }
    }

    function changeSlide(direction) {
      const slides = document.querySelectorAll('.slide-viewport');
      if (!slides.length) return;
      let nextIndex = currentSlide + direction;
      if (nextIndex < 1) nextIndex = 1;
      if (nextIndex > slides.length) nextIndex = slides.length;
      showSlide(nextIndex);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    window.addEventListener('hashchange', () => {
      const slides = document.querySelectorAll('.slide-viewport');
      if (!slides.length) return;
      const match = window.location.hash.match(/\d+/);
      if (match) {
        const slideNum = parseInt(match[0], 10);
        if (slideNum >= 1 && slideNum <= slides.length && slideNum !== currentSlide) {
          showSlide(slideNum, false);
        }
      }
    });

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        changeSlide(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        changeSlide(-1);
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // Render immediately on DOM load
    document.addEventListener('DOMContentLoaded', renderDeck);
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      renderDeck();
    }
  </script>
</body>
</html>
