<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeyondSensor - Executive Summary Tender Presentation Deck (FMS)</title>
  <link rel="stylesheet" href="deck-styles.css">
</head>
<body>

  <!-- Slide Container: Dynamic Ingestion from slides/ folder -->
  <div id="deck-container">
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: #FFF; font-family: sans-serif;">
      Loading presentation slides...
    </div>
  </div>

  <!-- Deck Navigation & Presentation Engine Controls -->
  <div class="deck-controls">
    <button class="deck-btn" id="prevBtn" onclick="changeSlide(-1)">◀ Prev</button>
    <div class="deck-status" id="slideStatus">Slide 1 of 9</div>
    <button class="deck-btn" id="nextBtn" onclick="changeSlide(1)">Next ▶</button>
    <button class="deck-btn" onclick="toggleFullscreen()" style="border-left: 1px solid rgba(255,255,255,0.2); margin-left: 6px;">⛶ Fullscreen</button>
    <button class="deck-btn" onclick="window.print()">🖨️ Print / PDF</button>
  </div>

  <script>
    // List of individual slide files structured in slides/ folder
    const slideFiles = [
      'slides/01-cover.html',
      'slides/02a-company-profile.html',
      'slides/02b-track-record.html',
      'slides/03-understanding-needs.html',
      'slides/04-architecture.html',
      'slides/05-user-workflows.html',
      'slides/06-notification-matrix.html',
      'slides/07-delivery-sla.html',
      'slides/08-ending.html'
    ];

    let currentSlide = 1;
    let totalSlides = slideFiles.length;

    async function loadAllSlides() {
      const container = document.getElementById('deck-container');
      try {
        const fetchPromises = slideFiles.map(async (file) => {
          const res = await fetch(file);
          if (!res.ok) throw new Error(`Failed to load ${file}`);
          return await res.text();
        });

        const slidesHtml = await Promise.all(fetchPromises);
        
        // Populate container and normalize asset paths for master viewer context
        container.innerHTML = slidesHtml.map((html, idx) => {
          // Adjust relative paths if needed: in slides/ it was ../../assets, from root it's ../assets
          let adjustedHtml = html.replace(/\.\.\/\.\.\/assets\//g, '../assets/');
          // Ensure first slide is active
          if (idx === 0 && !adjustedHtml.includes(' active')) {
            adjustedHtml = adjustedHtml.replace('class="slide-viewport', 'class="slide-viewport active');
          }
          return adjustedHtml;
        }).join('\n');

        totalSlides = document.querySelectorAll('.slide-viewport').length;
        showSlide(1);
      } catch (err) {
        console.warn('Fetch loading fallback (e.g. running from direct file:// without server):', err);
        // If fetch is restricted by browser local file origin policy, display helpful note
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #FFF; font-family: sans-serif; text-align: center; padding: 20px;">
            <h2 style="color: #FF54B0; margin-bottom: 10px;">Notice: Local Browser Security Policy</h2>
            <p style="max-width: 600px; color: #CBD5E1; line-height: 1.5; margin-bottom: 20px;">
              When opening directly via <code>file://</code> in some browsers, JavaScript <code>fetch()</code> to local folders may be restricted.
            </p>
            <p style="color: #94A3B8; font-size: 13px;">
              You can run a quick local server (e.g., VS Code "Live Server" or <code>npx serve .</code>), or review individual slides directly in the <code>slides/</code> directory.
            </p>
          </div>
        `;
      }
    }

    function showSlide(n) {
      const slides = document.querySelectorAll('.slide-viewport');
      if (!slides.length) return;
      slides.forEach(el => el.classList.remove('active'));
      
      const target = slides[n - 1];
      if (target) {
        target.classList.add('active');
        currentSlide = n;
        document.getElementById('slideStatus').innerText = `Slide ${currentSlide} of ${slides.length}`;
      }
    }

    function changeSlide(direction) {
      const slides = document.querySelectorAll('.slide-viewport');
      if (!slides.length) return;
      let nextIndex = currentSlide + direction;
      if (nextIndex < 1) nextIndex = 1;
      if (nextIndex > slides.length) nextIndex = slides.length;
      showSlide(nextIndex);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        changeSlide(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        changeSlide(-1);
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // Initialize slides on load
    loadAllSlides();
  </script>
</body>
</html>
