<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeyondSensor - Executive Summary Tender Presentation Deck (FMS)</title>
  <link rel="stylesheet" href="deck-styles.css">
  <!-- Load modular slides registry directly: works seamlessly via file:// and http:// -->
  <script src="slides/deck-registry.js"></script>
</head>
<body>

  <!-- Slide Container -->
  <div id="deck-container">
    <div style="display: flex; align-items: center; justify-content: center; height: 100vh; color: #FFF; font-family: sans-serif;">
      Loading presentation slides...
    </div>
  </div>

  <!-- Deck Navigation & Presentation Engine Controls -->
  <div class="deck-controls">
    <button class="deck-btn" id="prevBtn" onclick="changeSlide(-1)">◀ Prev</button>
    <div class="deck-status" id="slideStatus">Slide 1 of 9</div>
    <button class="deck-btn" id="nextBtn" onclick="changeSlide(1)">Next ▶</button>
    <button class="deck-btn" onclick="toggleFullscreen()" style="border-left: 1px solid rgba(255,255,255,0.2); margin-left: 6px;">⛶ Fullscreen</button>
    <button class="deck-btn" onclick="window.print()">🖨️ Print / PDF</button>
  </div>

  <script>
    let currentSlide = 1;

    function renderDeck() {
      const container = document.getElementById('deck-container');
      
      if (window.DECK_SLIDES && window.DECK_SLIDES.length > 0) {
        container.innerHTML = window.DECK_SLIDES.map((html, idx) => {
          let adjustedHtml = html;
          // Ensure first slide has active class
          if (idx === 0 && !adjustedHtml.includes(' active')) {
            adjustedHtml = adjustedHtml.replace('class="slide-viewport', 'class="slide-viewport active');
          }
          return adjustedHtml;
        }).join('\n');

        showSlide(1);
      } else {
        container.innerHTML = `
          <div style="display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; color: #FFF; font-family: sans-serif; text-align: center;">
            <h3 style="color: #FF54B0;">Unable to load slide templates</h3>
            <p style="color: #94A3B8;">Please check slides/deck-registry.js</p>
          </div>
        `;
      }
    }

    function showSlide(n) {
      const slides = document.querySelectorAll('.slide-viewport');
      if (!slides.length) return;
      slides.forEach(el => el.classList.remove('active'));
      
      const target = slides[n - 1];
      if (target) {
        target.classList.add('active');
        currentSlide = n;
        document.getElementById('slideStatus').innerText = `Slide ${currentSlide} of ${slides.length}`;
      }
    }

    function changeSlide(direction) {
      const slides = document.querySelectorAll('.slide-viewport');
      if (!slides.length) return;
      let nextIndex = currentSlide + direction;
      if (nextIndex < 1) nextIndex = 1;
      if (nextIndex > slides.length) nextIndex = slides.length;
      showSlide(nextIndex);
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
      } else {
        if (document.exitFullscreen) {
          document.exitFullscreen();
        }
      }
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ' || e.key === 'PageDown') {
        changeSlide(1);
      } else if (e.key === 'ArrowLeft' || e.key === 'PageUp') {
        changeSlide(-1);
      } else if (e.key.toLowerCase() === 'f') {
        toggleFullscreen();
      }
    });

    // Render immediately on DOM load
    document.addEventListener('DOMContentLoaded', renderDeck);
    if (document.readyState === 'interactive' || document.readyState === 'complete') {
      renderDeck();
    }
  </script>
</body>
</html>
